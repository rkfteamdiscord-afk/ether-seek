name: Gardien du site

# Chaque passage vérifie le site une fois par minute pendant environ 50 minutes, puis
# relance le suivant : la surveillance est continue. Le planning toutes les 5 minutes
# sert de filet si la chaîne s'arrête. Analyse par l'IA toutes les 5 minutes (ou en cas
# d'incident), une publication sur le site toutes les 15 minutes au maximum.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      analyse:
        description: "Lancer l'analyse complète par l'IA maintenant"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: gardien
  cancel-in-progress: false

jobs:
  gardien:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Installer les dépendances
        run: bun install --frozen-lockfile || bun install

      - name: Surveiller, analyser et corriger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
          GARDIEN_DEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.analyse && '1' || '0' }}
          GARDIEN_ROUNDS: "50"
          GARDIEN_CHAIN: "1"
          GARDIEN_ANALYSE_MIN: "5"
          GARDIEN_PUBLISH_MIN: "15"
        run: node scripts/gardien/run.mjs
